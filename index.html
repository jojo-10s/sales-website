<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Sales Specialist</title>
    
    <!-- TAILWIND CSS - Untuk styling cepat dan responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FONT AWESOME - Untuk icon profesional -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- GOOGLE FONTS - Untuk typography yang bagus -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles untuk personal touch */
        body {
            font-family: 'Inter', sans-serif;
        }   
        
        /* Smooth scrolling untuk navigasi */
        html {
            scroll-behavior: smooth;
        }
        
        /* Hover effects untuk professional touch */
        .hover-lift:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Navigation akan di-render oleh JavaScript -->
    <div id="navbar"></div>
    
    <!-- Hero Section - First impression yang kuat -->
    <section id="hero"></section>
    
    <!-- About Section - Build trust dan credibility -->
    <section id="about"></section>
    
    <!-- Services Section - Apa yang saya tawarkan -->
    <section id="services"></section>
    
    <!-- Testimonials Section - Social proof -->
    <section id="testimonials"></section>
    
    <!-- Contact Section - Call to action -->
    <section id="contact"></section>
    
    <!-- Footer - Additional info -->
    <footer id="footer"></footer>

    <!-- JavaScript kita - Semua logic ada di sini -->
    <script src="script.js"></script>
</body>
</html>
